<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCal → B5 EPUB 変換</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>iCal → B5 EPUB 変換アプリ</h1>
      <p>ics ファイルを読み込み、B5レイアウトを意識した EPUB を生成します。</p>

      <form id="convertForm">
        <label>
          icsファイル
          <input type="file" name="icalFile" accept=".ics,text/calendar" required />
        </label>

        <label>
          EPUBタイトル
          <input type="text" name="title" value="Calendar Export" maxlength="120" />
        </label>

        <label>
          文字サイズ(px)
          <input type="number" name="fontSize" min="12" max="24" value="16" />
        </label>

        <button type="submit">EPUBを作成</button>
      </form>

      <p id="status"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
